# Pricing used ONLY in summary (post-hoc). Eval never reads this for USD.
# Update `as_of` and rates when you recompute cost. Units: USD per 1M tokens.
# OpenRouter crawl 2026-07-26: price_per_token × 1e6 → per_1m.

as_of: "2026-07-26"

# Approximate human baseline (crowdsource-style). Tune for your narrative.
human:
  cost_per_rating_usd: 0.08
  # mean annotators ≈ human_n on mem_enc (~40); summary can also use per-row human_n
  default_annotators_per_sentence: 40
  notes: >-
    Rough slide estimate (~$0.08/rating × ~40 ≈ $3.20/sentence); NOT the Amouyal paper invoice.
    Market refs (checked 2026-07):
    (1) Prolific: min $8/hr, recommend $12/hr; academic platform fee +33.3% (corp +42.8%) —
        https://www.prolific.com/pricing — 20–30s/rating → worker ~$0.04–$0.10; +fee ~$0.06–$0.14.
    (2) Amazon MTurk: requester-set reward; fee 20% (<10 assignments/HIT) or 40% (≥10) —
        https://requester.mturk.com/pricing — short judgment HITs often ~$0.01–$0.05 worker;
        linguistics packs (e.g. ~100 judgments/$3 ≈ ~$0.03/item + fee; Sprouse 2011 BRM).
    (3) Scale Rapid self-serve (ballpark): ~$0.05/labeling unit —
        industry writeups (Scale does not publish full public list).
    $0.08 sits mid Prolific-ethical range for a short Likert judgment (+ modest platform overhead).

